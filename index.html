 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CheeseCam</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>
    <div class="text-center">

        <h1 class="title">

            CheeseCam
        </h1>

        <img
            src="https://media.tenor.com/OV4WRy2t2FkAAAAj/selfie-cheese.gif",
            style="margin-bottom: 5px; margin-top: 0;"
            alt="Selfie Cheese">

<center>
        <div class="div">

            <h4>

                Want to take a picture?

                <br>

                Just click
                <span style="color: yellow; font-size: large;">
                    Start
                </span>

                & say

                <b style="color: yellow; font-size: large;">
                    "Cheese!"
                </b>

            </h4>

        </div>

</center>

<br>

        <div class="box">

            <h5 style="font-size: 35px; margin-top: 10px; margin-bottom: 10px; text-shadow: yellow 0px 3px 5px;">
                Your voice output
            </h5>

            <textarea
                id="textBox"
                cols="50"
                rows="3"
                placeholder="Your voice will appear here..."></textarea>

        </div>



        <div class="container my-4">

            <div class="row g-4">



                <div class="col-md-6">

                    <div class="camera-card">


                        <h4>
                         <img width="65px" src="cheese.png">  Your Webcam  <img width="65px" src="cheese.png">
                        </h4>

                        <div id="video"></div>

                    </div>

            </div>

                <div class="col-md-6">

                    <div class="camera-card">

                        <h4>
                           <img width="65px" src="cheese.png"> Your Selfie <img width="65px" src="cheese.png">
                        </h4>

                        <div id="img1"></div>

                    </div>

                </div>


            </div>

        </div>



        <div class="boxx">

            <button onclick="start()">
                Start
            </button>

            <h5>
                Press Start and get ready!
            </h5>

        </div>


    </div>



<footer style="text-align: center; color: #666688; padding: 12px; font-size: 0.8rem; font-family: monospace;">
    <span style="color: #fcf957; font-weight: bold;"> Developed & Designed by Shafira Alam</span>
</footer>



<script src="main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/webcamjs/1.0.26/webcam.min.js"></script>


</body>


</html>
